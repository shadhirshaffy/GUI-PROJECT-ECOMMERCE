src/
├── assets/             # Static assets (images, fonts) & global CSS (tailwind.css)
├── components/         
│   ├── ui/             # Reusable base UI (e.g., BaseCard.vue, BaseButton.vue, BaseModal.vue)
│   ├── layout/         # Layout components (e.g., TheNavbar.vue, TheFooter.vue)
│   └── features/       # Domain-specific components (e.g., ProductGrid.vue, CartSlideover.vue)
├── composables/        # Vue composables (e.g., useFetchProducts.ts, useDarkMode.ts)
├── router/             # Vue Router configuration
├── stores/             # Pinia state management
│   ├── cart.ts         # Cart logic with localStorage persistence
│   └── auth.ts         # Mock authentication store (for Bonus 1)
├── types/              # Global TypeScript interfaces
│   └── index.ts        # Interfaces (Product, CartItem, User)
├── views/              # Page-level route components
│   ├── Storefront.vue  # Main products view
│   └── LoginView.vue   # Auth view (for Bonus 1)
├── App.vue             # Root component
└── main.ts             # App entry point
